<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | SocialBoost</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #050505;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}


.box {
    background: rgba(255,255,255,0.08);
    padding: 35px;
    border-radius: 25px;
    width: 90%;
    max-width: 450px;
}


.logo {
    font-size: 30px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 25px;
}


.logo span {
    color: #1E90FF;
}


h2 {
    text-align: center;
}


input, select {

    width: 100%;
    padding: 15px;
    margin: 10px 0;
    border-radius: 10px;
    border: none;
    font-size: 16px;

}


button {

    width: 100%;
    background: #1E90FF;
    color: white;
    border: none;
    padding: 16px;
    border-radius: 30px;
    font-size: 17px;
    margin-top: 15px;
    cursor: pointer;

}


</style>

</head>


<body>


<div class="box">


<div class="logo">
SOCIAL <span>BOOST</span>
</div>


<h2>
Vamos impulsionar sua marca 🚀
</h2>


<input placeholder="Seu nome">


<input placeholder="WhatsApp">


<input placeholder="Instagram (URL do perfil)">


<select>

<option>
Escolha seu segmento
</option>

<option>
Restaurante
</option>

<option>
Barbearia
</option>

<option>
Loja
</option>

<option>
Estética
</option>

<option>
Outro
</option>

</select>


<input id="planoEscolhido" readonly placeholder="Plano selecionado">


<button onclick="enviarWhatsApp()">
Continuar para pagamento
</button>


</div>

<script>

const urlParams = new URLSearchParams(window.location.search);

const plano = urlParams.get("plano");

const campoPlano = document.getElementById("planoEscolhido");


if(plano === "presenca"){
campoPlano.value = "Plano Presença - R$29,90";
}


if(plano === "crescimento"){
campoPlano.value = "Plano Crescimento - R$99,90";
}


if(plano === "autoridade"){
campoPlano.value = "Plano Autoridade - R$179,90";
}
function enviarWhatsApp(){

const nome = document.querySelector('input[placeholder="Seu nome"]').value;

const whatsapp = document.querySelector('input[placeholder="WhatsApp"]').value;

const instagram = document.querySelector('input[placeholder="Instagram (URL do perfil)"]').value;

const segmento = document.querySelector('select').value;

const mensagem = 
"Novo pedido SocialBoost 🚀%0A%0A" +
"Nome: " + nome + "%0A" +
"WhatsApp: " + whatsapp + "%0A" +
"Instagram: " + instagram + "%0A" +
"Segmento: " + segmento + "%0A" +
"Plano: " + campoPlano.value;


window.open(
"https://wa.me/5515991960669?text=" + mensagem,
"_blank"
);

}

function pagamento(){

if(plano === "presenca"){

window.location.href="https://mpago.la/1h41weo";

}


if(plano === "crescimento"){

window.location.href="https://mpago.la/1qSk9CQ";

}


if(plano === "autoridade"){

alert("Link do plano Autoridade ainda não configurado");

}

}

</script>
</body>

</html>
